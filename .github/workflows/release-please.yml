name: Create Release PR

on:
  push:
    branches:
      - main
    paths-ignore:
      - "portfolio-content/**"
      - ".github/**"
      - ".vscode/**"
      - ".gitignore"
      - "README.md"
      - "PRIVACY.md"
      - "TERMS.md"

jobs:
  # Portão: nenhuma versão é gerada a partir de uma main quebrada.
  verify:
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          release-type: node
