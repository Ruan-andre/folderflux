name: Publish Release FolderFlux

on:
  push:
    tags:
      - "v*" # Roda sempre que uma tag começando com 'v' (ex: v1.0.1) for enviada

jobs:
  # Portão: se qualquer checagem falhar, nenhum instalador é gerado nem publicado.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and Publish
    needs: verify
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: publish:win
          - os: ubuntu-latest
            script: publish:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Sem `version`: a action lê o campo `packageManager` do package.json,
        # então CI e máquina local usam exatamente o mesmo pnpm.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Publish
        run: pnpm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
