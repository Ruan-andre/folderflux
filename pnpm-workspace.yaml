# Aprovação de scripts de build de dependências.
#
# No pnpm 11 o `allowBuilds` substituiu `onlyBuiltDependencies`,
# `ignoredBuiltDependencies`, `neverBuiltDependencies`, `onlyBuiltDependenciesFile`
# e `ignoreDepScripts`. É um mapa nome -> booleano, e o install falha com
# ERR_PNPM_IGNORED_BUILDS enquanto houver pacote pendente de decisão.
allowBuilds:
  # Módulo nativo: sem o rebuild o app não abre o banco.
  better-sqlite3: true
  # O postinstall baixa o binário do Electron.
  electron: true
  # O postinstall instala o binário da plataforma, usado pelo Vite.
  esbuild: true
  # Telemetria da Scarf: sem função no produto.
  "@scarf/scarf": false
  # Gerador de instalador Windows do electron-builder.
  electron-winstaller: true

# Força node-abi 4.x para que @electron/rebuild consiga detectar o ABI
# do Electron 43. O electron-builder traz node-abi 3.x que não tem esse
# mapeamento.
overrides:
  node-abi: "^4.33.0"
  # Correções de segurança: dependências transitivas vulneráveis
  # tar: DoS via decompress (GHSA-23hp-3jrh-7fpw / GHSA-r292-9mhp-454m)
  tar: ">=7.5.22"
  # xmldom: múltiplas injeções de XML e ReDoS (GHSA-*)
  "@xmldom/xmldom": ">=0.8.15"
  # browserslist: OOM e prototype write (GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g)
  browserslist: ">=4.28.7"
  # postcss: path traversal via sourceMappingURL (GHSA-r28c-9q8g-f849)
  postcss: ">=8.5.18"
  # nanoid: integer overflow e loop infinito (GHSA-xwg4-73v4-xw9w / GHSA-28wg-ghj8-5hjv / GHSA-2v37-7h3g-55p8)
  nanoid: ">=3.3.18"
  # js-yaml: CPU DoS via omap e maxTotalMergeKeys (GHSA-5p4m-2wfm-xmqj / GHSA-2883-xcg3-v3hh)
  js-yaml: ">=4.3.2"
  # deepmerge-ts: stack overflow com grafos recursivos (GHSA-ggr8-5vv4-36mx)
  deepmerge-ts: ">=8.0.0"
  # @humanfs/node: cópia recursiva segue symlinks (GHSA-p498-v437-472g)
  "@humanfs/node": ">=0.16.8"
  # @babel/core: leitura de arquivo via sourceMappingURL (GHSA-4x5r-pxfx-6jf8)
  "@babel/core": ">=7.29.1"
  # tar-fs: symlink validation bypass (GHSA via better-sqlite3 > prebuild-install)
  tar-fs: ">=2.1.4"
  # glob: command injection via -c/--cmd (GHSA via electron-builder)
  glob: ">=10.5.0"
  # minimatch: ReDoS via wildcards e extglobs (GHSA via electron-builder / node-gyp)
  minimatch: ">=9.0.7"
  # brace-expansion: DoS via expansao exponencial (GHSA via minimatch > node-gyp)
  brace-expansion: ">=2.1.4"
  # flatted: DoS via recursao ilimitada e prototype pollution (GHSA via eslint)
  flatted: ">=3.4.2"
  # lodash: code injection via _.template (GHSA via electron-builder > flatpak-bundler)
  lodash: ">=4.17.24"
  # tmp: path traversal via prefix/postfix (GHSA via electron-builder > flatpak-bundler)
  tmp: ">=0.2.6"
  # form-data: CRLF injection em multipart (GHSA via electron-builder)
  form-data: ">=4.0.6"
  # builder-util-runtime: vazamento de token em redirect cross-origin (GHSA via electron-builder)
  builder-util-runtime: ">=9.7.0"
